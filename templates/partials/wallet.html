{# Card slides out of a wallet and taps. Pure SVG + CSS animation (see auth.css). #}

     stroke-linejoin="round" aria-hidden="true" focusable="false">
  <path class="arc arc-1" d="M162 70 Q220 46 278 70"/>
  <path class="arc arc-2" d="M140 70 Q220 34 300 70"/>
  <path class="arc arc-3" d="M118 70 Q220 22 322 70"/>

  <rect class="wallet-back" x="90" y="215" width="260" height="175" rx="18"/>

  <g transform="translate(135 100)">
    <g class="wallet-card">
      <rect width="170" height="108" rx="12"/>
      <rect x="19" y="23" width="30" height="24" rx="5"/>
      <line x1="19" y1="71" x2="115" y2="71"/>
      <line x1="19" y1="85" x2="77" y2="85"/>
    </g>
  </g>

  <rect class="wallet-front" x="90" y="240" width="260" height="150" rx="18"/>
  <line class="wallet-stitch" x1="112" y1="262" x2="328" y2="262"/>
  <circle class="wallet-clasp" cx="220" cy="318" r="10"/>
</svg>
